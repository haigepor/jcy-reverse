org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

kotlin.code.style=official

## ---------------------------------------------------------------- 本机适配
## 1) JDK：PATH 上是 JDK 11，而 AGP 8.7 要求 JDK >= 17。
##    此处显式指向本机 JDK 21，避免依赖外部 JAVA_HOME。
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.10.7-hotspot

## 2) 代理：全局 ~/.gradle/gradle.properties 里硬编码了 192.168.64.8:10808，
##    实测已失效（curl 超时 / Gradle 报 connect timed out）。
##    注意：仅把 proxyHost 置空无效（Gradle 会跳过空值，全局设置仍生效）。
##    可靠做法是用 nonProxyHosts=* 让 JVM 对所有主机绕过代理。
##    若直连不可用，删掉 nonProxyHosts 两行，改用：
##      systemProp.http.proxyHost=127.0.0.1
##      systemProp.http.proxyPort=8770
systemProp.http.nonProxyHosts=*
systemProp.https.nonProxyHosts=*

## 3) 仓库路径含非 ASCII（囧次元），AGP 默认拒绝。
##    TODO: 若 NDK/CMake 在非 ASCII 路径下报错，需把构建树迁到纯 ASCII 路径。
android.overridePathCheck=true
