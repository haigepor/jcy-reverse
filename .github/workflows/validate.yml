name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: 结构校验与协议测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（跳过工具与 Python 下载）
        run: pnpm install --ignore-scripts
        env:
          JCY_SKIP_TOOLS: "1"
          JCY_SKIP_PYTHON: "1"

      - name: 结构校验（README 目录树 ↔ 文件系统）
        run: pnpm validate

      - name: 安装 Python 与协议库依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pycryptodome>=3.20,<4"

      - name: 协议层测试（含真机向量）
        run: python tests/test_channels.py
